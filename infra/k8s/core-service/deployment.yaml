apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: alphaadopter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: 548088753563.dkr.ecr.ap-northeast-2.amazonaws.com/alphaadopter/core-service:latest
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: DB_HOST
              value: "alphaadopter-db.cv4kio0kyh90.ap-northeast-2.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: MONGODB_URI
              value: "mongodb://mongodb.alphaadopter.svc.cluster.local:27017/alpha_adopter"
            - name: REDIS_HOST
              value: "alphaadopter-redis.zdshv2.0001.apn2.cache.amazonaws.com"
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "alphaadopter-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            # 이 환경에는 SMTP 서버를 두지 않아(다이제스트 메일 미발송) 메일 헬스 체크가 전체 상태를
            # DOWN으로 만든다. 실제 SMTP를 붙이면 MAIL_HOST 등과 함께 다시 켠다.
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              value: "false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: DB_PASSWORD
            - name: NAVER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: NAVER_CLIENT_ID
            - name: NAVER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: NAVER_CLIENT_SECRET
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: ADMIN_EMAILS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: ANTHROPIC_API_KEY
            # 임베딩 기반 중복 기사 제거(NewsDeduplicationService). 키가 없으면 기능만 꺼지도록 optional
            - name: VOYAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: core-service-secrets
                  key: VOYAGE_API_KEY
                  optional: true
          # 예전엔 프로브가 없어 컨테이너가 뜨자마자(기동 25초 전) 트래픽을 받고, 멈춰도 재시작되지
          # 않았다. 기동은 startupProbe가 기다리고, 이후 준비 상태·생존 여부를 각각 확인한다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: alphaadopter
  labels:
    app: core-service
  # 기본(Classic ELB)은 클라이언트 IP를 넘겨주지 않아, IP 기준 rate limit이 모든 사용자를 로드밸런서
  # 주소 몇 개로 뭉쳐 세거나, 위조 가능한 X-Forwarded-For에 기대야 했다. NLB + externalTrafficPolicy:
  # Local은 실제 클라이언트 IP를 연결 주소 그대로 전달하므로 헤더를 신뢰하지 않아도 된다
  # (app.rate-limit.trusted-proxy-hops=0, RateLimitFilter 참고).
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: core-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: core-service
  namespace: alphaadopter
spec:
  selector:
    matchLabels:
      app: core-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
