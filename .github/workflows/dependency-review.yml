name: Dependency review

# PR이 새로 추가/변경하는 의존성을 GitHub Advisory Database와 대조해, 알려진 취약점이
# 있는 패키지가 들어오면 PR 체크를 실패시킨다. Dependabot(.github/dependabot.yml)이
# "이미 들어와 있는" 의존성의 취약점을 주기적으로 찾아 업데이트 PR을 올리는 것과 달리,
# 이건 "새로 들어오는" 의존성을 PR 시점에 막는 역할이라 서로 보완적이다.
on:
  pull_request:

permissions:
  # dependency-submission이 의존성 스냅샷을 생성하는 동작이라 contents: write가 필요하다
  # (read로는 "Resource not accessible by integration"으로 실패 — 실제로 겪음).
  contents: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # core-service(Gradle)의 의존성 버전 상당수가 Spring Boot BOM으로 관리돼 build.gradle.kts
      # 파일만 정적으로 읽어서는 실제 버전을 알 수 없다 — 그래서 GitHub Dependency Graph가
      # core-service를 전혀 인식하지 못했다(확인 완료). 실제로 Gradle을 돌려 해석된 의존성
      # 그래프를 제출해야 dependency-review-action과 Dependabot이 core-service도 볼 수 있다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Submit core-service Gradle dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: core-service
          # 필터 없이 전체 제출하면 앱이 실제로 쓰는 configuration뿐 아니라 Gradle
          # buildscript/플러그인 classpath(spring-boot-gradle-plugin 등이 빌드 시점에만
          # 쓰는 jackson-core 등)까지 같이 들어가 배포되지도 않는 빌드 전용 취약점으로
          # PR 체크가 실패하는 걸 실제로 겪었다. 앱이 실제로 쓰는 4개 configuration만 남긴다.
          dependency-graph-include-configurations: "^(compileClasspath|runtimeClasspath|testCompileClasspath|testRuntimeClasspath)$"

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
