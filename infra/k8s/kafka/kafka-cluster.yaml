# 로컬 docker-compose의 bitnami/kafka(KRaft 단일 브로커)를 EKS 위 Strimzi로 재현
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: alphaadopter-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  # 요청·한도가 없으면 브로커 JVM이 노드 메모리를 예측 불가하게 쓰고, 스케줄러도 이를 모른 채 다른
  # 파드를 같은 노드에 몰아넣는다. 힙은 컨테이너 한도의 절반 정도로 두고 나머지는 페이지 캐시에 남긴다.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1536Mi
  jvmOptions:
    -Xms: 512m
    -Xmx: 768m
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: alphaadopter-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    # strimzi.io/install/latest(최신 오퍼레이터)가 3.x를 더 이상 지원하지 않아
    # (Unsupported Kafka.spec.kafka.version 에러로 실제로 확인) 지원 버전 중 최신으로 고정.
    # 같은 일이 반복되지 않도록 오퍼레이터 버전도 infra/scripts/cluster-up.sh에서 고정한다.
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 384Mi
