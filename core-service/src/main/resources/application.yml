spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alpha_adopter}
    username: ${DB_USERNAME:alpha_adopter}
    password: ${DB_PASSWORD:alpha_adopter}
  jpa:
    hibernate:
      # 초기 개발 단계 편의상 update 사용. 도메인 안정화 후 Flyway 마이그레이션 + validate로 전환 예정
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
