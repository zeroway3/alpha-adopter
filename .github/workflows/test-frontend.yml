name: Test frontend

# core-service의 test-core-service.yml과 동일한 취지 — PR 단계에서 타입 오류/테스트
# 실패를 미리 잡는다. 빌드 자체(정적 리소스 산출)는 deploy-core-service.yml의 Docker
# 멀티스테이지 빌드에서 처리하므로, 여기서는 타입체크+유닛테스트까지만 검증한다.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run
