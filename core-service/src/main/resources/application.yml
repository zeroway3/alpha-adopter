spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:alpha_adopter}
    username: ${DB_USERNAME:alpha_adopter}
    password: ${DB_PASSWORD:alpha_adopter}
  jpa:
    hibernate:
      # 초기 개발 단계 편의상 update 사용. 도메인 안정화 후 Flyway 마이그레이션 + validate로 전환 예정
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/alpha_adopter}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: core-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.alphaadopter.core.*"

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

app:
  # 다이제스트 이메일의 클릭 추적 리다이렉트 링크를 만들 때 사용. 배포 환경에서는 실제 공개 도메인으로 교체
  base-url: ${APP_BASE_URL:http://localhost:8090}
  admin:
    # 관리자 화면(/api/admin/**) 접근을 허용할 이메일 목록 (콤마 구분). 로그인 자체는 이메일+비밀번호로
    # 인증하지만, "누가 관리자인가"는 별도 역할(Role) 테이블 없이 배포 환경변수로만 판단한다
    # (AdminEmailChecker 참고). 공개 저장소라 실제 이메일은 여기 커밋하지 않고
    # core-service-secrets(K8s Secret)의 ADMIN_EMAILS 키로만 주입한다.
    emails: ${ADMIN_EMAILS:}
  jwt:
    # HS256은 최소 256비트(32바이트) 키 필요. 로컬 기본값은 개발 편의용이며, 배포 환경에서는
    # core-service-secrets(K8s Secret)의 JWT_SECRET으로 반드시 교체해서 사용한다.
    secret: ${JWT_SECRET:M0851ikfMgAC8/ZE7Eb6/CKw1C0JFEtbwlHs9q1vLxQ=}
  ai:
    # 키워드 문자열 매칭만으로는 걸러지지 않는 노이즈를 Claude로 2차 필터링한다.
    # 키가 없으면(로컬 기본값처럼 빈 문자열) RelevanceScorer가 자동으로 비활성화되고
    # 기존 문자열 매칭 결과를 그대로 신뢰한다 — 기여자 전원이 Claude 키를 가질 필요는 없음.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_RELEVANCE_MODEL:claude-haiku-4-5-20251001}
    relevance-threshold: ${AI_RELEVANCE_THRESHOLD:50}
  kafka:
    topic:
      news-raw: news.raw
      news-matched: news.matched
  collector:
    fixed-delay-ms: ${COLLECTOR_INTERVAL_MS:60000}
  subscription:
    # NAVER API HUB 월 할당량(775,000회) 보호용. 고유 키워드 하나당 collector.fixed-delay-ms 간격으로
    # 계속 호출되므로, 기본 60초 간격 기준 775000 / (1440회/일 * 30일) ≈ 17.9개가 이론상 한계 — 여유를 두고 15로 제한
    max-distinct-keywords: ${SUBSCRIPTION_MAX_DISTINCT_KEYWORDS:15}
  notification:
    channel: notifications
    heartbeat-interval-ms: ${NOTIFICATION_HEARTBEAT_INTERVAL_MS:20000}
    digest-cron: ${NOTIFICATION_DIGEST_CRON:0 0 9 * * *}
    digest-from-address: ${NOTIFICATION_DIGEST_FROM:no-reply@alphaadopter.local}
