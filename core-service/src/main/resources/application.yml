spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:alpha_adopter}
    username: ${DB_USERNAME:alpha_adopter}
    password: ${DB_PASSWORD:alpha_adopter}
  jpa:
    hibernate:
      # 초기 개발 단계 편의상 update 사용. 도메인 안정화 후 Flyway 마이그레이션 + validate로 전환 예정
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/alpha_adopter}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: core-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.alphaadopter.core.*"

server:
  port: ${SERVER_PORT:8090}

naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

app:
  kafka:
    topic:
      news-raw: news.raw
      news-matched: news.matched
  collector:
    fixed-delay-ms: ${COLLECTOR_INTERVAL_MS:60000}
