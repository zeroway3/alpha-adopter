# 로컬 docker-compose의 mongo:7(인증 없음)을 EKS 위에 그대로 재현
apiVersion: v1
kind: Namespace
metadata:
  name: alphaadopter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: alphaadopter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: alphaadopter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: alphaadopter
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
